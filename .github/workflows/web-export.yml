# ═══════════════════════════════════════════════════════════════
#  RAW Radio App — Web export (prebuilt static site for raw-radio.ru)
#
#  Builds the Expo web export (`dist/`) as a downloadable artifact and
#  VERIFIES it. No VPS secret is needed here: the monorepo
#  (`raw-radio/raw-radio`) downloads the artifact and ships it with
#  `infra/deploy-web-static.sh` — see docs/WEB_STATIC_DEPLOY.md §7.
#
#  Two things this workflow exists to guarantee:
#
#  1. `--clear` (+ `rm -rf dist`). Without it Metro reuses its cached bundle
#     and SILENTLY ignores changed EXPO_PUBLIC_* values, so a build meant to be
#     same-origin can ship absolute https://raw-radio.ru URLs from the previous
#     bundle. See docs/WEB_STATIC_DEPLOY.md §3 "Why --clear".
#  2. `scripts/verify-web-export.sh` — the assertion that PROVES (1) worked:
#     it fails the build if an absolute https://raw-radio.ru leaked into the
#     bundles (the copyright@raw-radio.ru e-mail is allowed). This is the guard
#     against the stale-cache trap; do not remove it.
#
#  Manual run: Actions → "RAW Radio App Web Export" → Run workflow
# ═══════════════════════════════════════════════════════════════

name: RAW Radio App Web Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'plugins/**'
      - 'scripts/verify-web-export.sh'
      - '.github/workflows/web-export.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  web-export:
    name: Build + verify web export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `EXPO_PUBLIC_API_URL=` / `EXPO_PUBLIC_WS_URL=` (empty on purpose) make the
      # export same-origin: the app falls back to relative URLs and therefore works
      # on any hostname. `--clear` is mandatory — the cache would otherwise win.
      - name: Build web export
        run: |
          rm -rf dist
          EXPO_PUBLIC_API_URL= EXPO_PUBLIC_WS_URL= npx expo export --platform web --clear

      # Same-origin assertion — fails the build if the stale cache won.
      - name: Verify export (no absolute API URLs)
        run: bash scripts/verify-web-export.sh dist

      - name: Package export
        run: tar -czf raw-radio-web.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-radio-web-export
          path: raw-radio-web.tar.gz
          if-no-files-found: error
          retention-days: 30
