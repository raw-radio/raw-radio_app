# ═══════════════════════════════════════════════════════════════
#  RAW Radio App — Android Release
#  Builds a SIGNED release APK and publishes it as a GitHub Release.
#
#  Usage:
#    git tag app-v0.2.0 && git push origin --tags
#    ...or build locally and publish the artifact you built — see docs/RELEASING.md §5
#    (`scripts/release-local.sh`), which is the preferred flow.
#
#  Manual run (build only, no release): Actions → "RAW Radio App Release" → Run workflow
#
#  ── Local builds win (release idempotency) ────────────────────────────────
#  `scripts/release-local.sh` builds the APK on the developer machine, then pushes the tag
#  and creates the GitHub Release with that exact binary. Pushing the tag also triggers this
#  workflow, which must therefore never clobber a release that already exists:
#    • `preflight` job — if a release for the tag already exists, the whole build is skipped
#      (saves ~20 CI minutes). It is best-effort: the tag is created a moment before the
#      release object, so a slow runner could still see "no release yet".
#    • `gate` step (right before publishing) — authoritative and race-free by construction:
#      it re-checks after the ~20 min build and skips publishing, keeping the locally built
#      artifact intact even if `preflight` missed.
#  Failure mode we accept: if both guards were to fail (e.g. GitHub API outage at both
#  moments), CI would publish its own APK of the same commit under the same asset name —
#  same version, different SHA-256. The workflow summary prints the SHA-256 so a mismatch is
#  detectable; the release notes are `generate_release_notes` (no locally written body to
#  lose). Re-running the workflow after the API recovers restores the guard behaviour.
#
#  Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#    ANDROID_KEYSTORE_BASE64  — base64 of the release keystore
#    KEYSTORE_PASSWORD        — keystore (store) password
#    KEY_ALIAS                — key alias inside the keystore
#    KEY_PASSWORD             — key password
#
#  Required repository config (… → Actions → Variables **or** Secrets):
#    EXPO_PUBLIC_ONESIGNAL_APP_ID — public OneSignal app id. It is a public value, so a
#                                   repository *variable* is the natural home, but a
#                                   *secret* with the same name works too (the workflow
#                                   reads `vars.… || secrets.…`). Either way the build
#                                   fails loudly when it is missing entirely — without it
#                                   push notifications would be silently disabled.
#  Optional variables:
#    EXPO_PUBLIC_API_URL / EXPO_PUBLIC_WS_URL (default https://raw-radio.ru)
#    ANDROID_KEYSTORE_TYPE (default pkcs12)
#
#  No secret is ever stored in this repository — see docs/RELEASING.md.
# ═══════════════════════════════════════════════════════════════

name: RAW Radio App Release

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (X.Y.Z). Leave empty to keep app.json as is.'
        required: false
        default: ''
      r8:
        description: 'EXPERIMENTAL: build with R8 + resource shrinking (manual runs only, never tags). Smoke-test the artifact on a device — see docs/RELEASING.md §6.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  # Must stay in sync with the NDK/CMake used by Expo SDK 57 (expo-modules-autolinking default).
  # See docs/RELEASING.md → Troubleshooting if the build stops with "NDK not configured".
  ANDROID_NDK_VERSION: '27.1.12297006'
  ANDROID_CMAKE_VERSION: '3.22.1'
  ANDROID_KEYSTORE_TYPE: ${{ vars.ANDROID_KEYSTORE_TYPE || 'pkcs12' }}
  # Public (non-secret) build config baked into the JS bundle. Never point these at localhost:
  # a release APK must talk to the production API.
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://raw-radio.ru' }}
  EXPO_PUBLIC_WS_URL: ${{ vars.EXPO_PUBLIC_WS_URL || 'https://raw-radio.ru' }}
  # Accepts the value from either an Actions *variable* or an Actions *secret* so the same
  # configuration works no matter which of the two it was stored in (see the guard below).
  EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ vars.EXPO_PUBLIC_ONESIGNAL_APP_ID || secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}
  EXPO_NO_TELEMETRY: '1'

jobs:
  # Best-effort early exit so a locally published release does not cost ~20 CI minutes.
  # This job ALWAYS runs (even for workflow_dispatch) so that `release` never depends on a
  # skipped job — the job-level `needs` + `if` combination is subtle and easy to get wrong.
  preflight:
    name: Check for an existing release
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Look up a release for this tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only `app-v*` tags can carry a release; manual runs have nothing to look up.
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^app-v'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `gh release view` exits 1 when there is no release (or no such tag).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $GITHUB_REF_NAME already exists — building it in CI would clobber the locally published APK. Skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build signed release APK
    needs: [preflight]
    # A failed preflight skips this job (Gradle never runs on a half-checked state); an
    # existing release means a locally built artifact is already published and wins.
    if: ${{ needs.preflight.outputs.release_exists != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # Only the dependency cache is cached — never the whole ~/.gradle/caches, so that
      # Gradle configuration-cache entries (project properties, i.e. signing passwords)
      # can never be persisted into a cache that outlives the job.
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Fail before the (long) native build if the public config is missing or points locally.
      - name: Validate public build config
        run: |
          set -euo pipefail
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_WS_URL; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "::error::$name is empty — the release build would not reach the API."
              exit 1
            fi
            case "$value" in
              http://*|*localhost*|*127.0.0.1*|*0.0.0.0*|*10.0.2.2*|*host.docker.internal*)
                echo "::error::$name must be a public https:// URL for a release build (got '$value')."
                exit 1
                ;;
            esac
          done
          # The OneSignal app id is resolved as `vars.EXPO_PUBLIC_ONESIGNAL_APP_ID ||
          # secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID` in the job env, so it does not matter
          # which of the two it was stored in. Public value → a variable is preferred,
          # but the guard must accept either. Fail loudly when both are unset.
          if [ -z "${EXPO_PUBLIC_ONESIGNAL_APP_ID:-}" ]; then
            echo "::error::EXPO_PUBLIC_ONESIGNAL_APP_ID is not set (checked repository variable and repository secret)."
            echo "::error::Set it in Settings → Secrets and variables → Actions → Variables (preferred) or → Secrets — see docs/RELEASING.md."
            exit 1
          fi
          # Catch a truncated/typo'd id here instead of shipping an APK whose push is dead.
          if ! printf '%s' "$EXPO_PUBLIC_ONESIGNAL_APP_ID" |
            grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::EXPO_PUBLIC_ONESIGNAL_APP_ID is not a OneSignal UUID (expected 8-4-4-4-12 hex digits)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # CI-only mutation of app.json in the runner workspace (never committed):
      # version from the tag, monotonic android.versionCode, OneSignal "production" mode.
      - name: Prepare release app config
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
        run: node scripts/prepare-release.mjs

      # Android native code (Reanimated, RN core CMake setup) is compiled here,
      # so the pinned NDK + CMake must be present.
      - name: Install Android NDK and CMake
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      # android/ is git-ignored and regenerated on every run (--clean), so it is never
      # hand-edited: Expo prebuild rebuilds it from app.json. The daemon memory that used to
      # OOM is applied by the local config plugin `plugins/withGradleJvmArgs` (registered in
      # app.json), which runs inside prebuild and therefore survives --clean.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install

      # Fail fast (seconds) instead of ~3 minutes into Gradle if the plugin stopped applying
      # or Expo changed the template. Keep in sync with plugins/withGradleJvmArgs.js.
      - name: Verify Gradle daemon memory settings
        run: |
          set -euo pipefail
          grep -E '^org\.gradle\.jvmargs=' android/gradle.properties
          if ! grep -Eq '^org\.gradle\.jvmargs=.*-Xmx6144m' android/gradle.properties; then
            echo "::error::android/gradle.properties does not carry the expected org.gradle.jvmargs."
            echo "::error::plugins/withGradleJvmArgs.js did not run — the release build would OOM."
            exit 1
          fi
          if ! grep -Eq '^org\.gradle\.jvmargs=.*MaxMetaspaceSize=1024m' android/gradle.properties; then
            echo "::error::org.gradle.jvmargs is missing -XX:MaxMetaspaceSize=1024m (lint OOMs on the 512m default)."
            exit 1
          fi

      # The keystore lives outside the workspace ($RUNNER_TEMP) and is decoded only for the
      # duration of the job. Note: it must be restored AFTER prebuild, because
      # `expo prebuild --clean` wipes the android/ directory.
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "::error::Repository secret $name is not set (see docs/RELEASING.md)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          # Fail fast: keystore file + store password + alias must be valid before Gradle starts.
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storetype "$ANDROID_KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # Signing: AGP's built-in injected signing (`android.injected.signing.*`) takes precedence
      # over the DSL `signingConfig` of every variant (AGP: SigningConfigResolver.resolveConfig
      # returns the override first). That is why the generated release build type, which points
      # at the debug keystore by default, does not need to be patched and no Expo config plugin
      # is required. The resulting signing config is named "externalOverride".
      #
      # `reactNativeArchitectures` drops the emulator-only x86/x86_64 ABIs → smaller APK.
      #
      # ── Lint is skipped ON PURPOSE (trade-off, read before removing) ──────────────
      # `assembleRelease` also wires in the release-only Android Lint gate
      # (`lintVitalRelease` → `lintVitalAnalyzeRelease`). It is *not* required for a working
      # APK, it re-lints every one of the ~50 native modules, and on run 35212151391 it died
      # with `java.lang.OutOfMemoryError: Java heap space` /
      # `Unexpected failure during lint analysis (this is a bug in lint or one of the libraries
      # it depends on)` — a known AGP/lint issue (google issuetracker 178631052) rather than a
      # problem in this app. The Expo CLI skips lint for its own builds
      # (`expo run:android` runs `assembleDebug -x lint -x test`), so this matches the tooling
      # the project is developed with.
      #
      # What we LOSE: `lintVital` is the only automatic fatal-severity Android lint check in
      # this repo. A fatal finding (e.g. a resource referenced but missing for one locale)
      # would no longer fail CI and could reach a device. Compensating controls: the daemon
      # memory fix above (so lint *can* run), the APK structure check (`aapt2 dump badging`)
      # and the signature check in the next steps, plus installing the artifact on a device
      # before announcing it (docs/RELEASING.md §3, step 5).
      # To re-enable later: drop the `-x` flags, keep the raised `org.gradle.jvmargs`, and
      # verify once on a runner before trusting it.
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          # R8 / resource shrinking is OFF for tag builds: it must be validated on a real
          # device first (reflection-heavy modules: OneSignal, Track Player, Reanimated).
          # The manual `r8` input exists so that a candidate can be produced and tested
          # without shipping it — see docs/RELEASING.md §6.
          R8_FLAGS=()
          if [ "${{ inputs.r8 }}" = "true" ]; then
            echo "::warning::Building with R8 + resource shrinking (EXPERIMENTAL). Smoke-test the artifact before enabling this for tag builds."
            R8_FLAGS+=(-Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true)
          fi

          ./gradlew assembleRelease --stacktrace \
            "${R8_FLAGS[@]}" \
            -x lint \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -Pandroid.injected.signing.store.type="$ANDROID_KEYSTORE_TYPE" \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      # Hard gate: structure + signature. All checks live in scripts/verify-apk.sh so the
      # local release flow (`scripts/release-local.sh`) runs exactly the same code.
      - name: Verify signature and collect APK
        id: apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK not found at $APK_SRC"
            exit 1
          fi

          # Stable asset name → https://github.com/raw-radio/raw-radio_app/releases/latest/download/raw-radio-universal.apk
          mkdir -p dist
          APK_NAME="raw-radio-universal.apk"
          cp "$APK_SRC" "dist/$APK_NAME"

          VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"

          echo "── verify-apk.sh (structure + signature) ────────────"
          # `bash <script>` (not `./script`) so a lost executable bit cannot break the run.
          bash scripts/verify-apk.sh \
            --apk "dist/$APK_NAME" \
            --keystore "$KEYSTORE_PATH" \
            --storepass "$KEYSTORE_PASSWORD" \
            --alias "$KEY_ALIAS" \
            --storetype "$ANDROID_KEYSTORE_TYPE" \
            --expect-version-code "$VERSION_CODE"
          printf '── apksigner verify --print-certs ───────────────────\n'
          "$(ls -1 "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"/build-tools/*/apksigner | sort -V | tail -1)" \
            verify --print-certs "dist/$APK_NAME"

          SHA256="$(sha256sum "dist/$APK_NAME" | awk '{print $1}')"
          SIZE="$(du -h "dist/$APK_NAME" | awk '{print $1}')"

          {
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "apk_path=dist/$APK_NAME"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## RAW Radio App v$VERSION (versionCode $VERSION_CODE)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`$APK_NAME\` ($SIZE) |"
            echo "| SHA-256 | \`$SHA256\` |"
            echo "| ABIs | armeabi-v7a, arm64-v8a |"
            echo "| API | $EXPO_PUBLIC_API_URL |"
            echo "| WS | $EXPO_PUBLIC_WS_URL |"
            echo "| Commit | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-radio-apk-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # Authoritative, race-free guard. `preflight` can be fooled by the milliseconds between
      # the tag being pushed and the release object appearing; ~20 minutes later it cannot.
      # If a release for this tag already exists (published from a local build), we keep it
      # untouched and only the workflow artifact above is produced.
      - name: Gate — do not clobber an existing release
        id: release_gate
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Release $GITHUB_REF_NAME already exists — CI keeps the existing (locally built) asset. Publishing skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Only tag pushes publish a release; manual runs stop after the artifact upload.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v') && steps.release_gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: RAW Radio App v${{ steps.apk.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.apk_path }}
